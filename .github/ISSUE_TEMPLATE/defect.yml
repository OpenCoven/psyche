name: Ordinary defect
description: Report a reproducible non-security defect
body:
  - type: markdown
    attributes:
      value: Report suspected vulnerabilities through the [Psyche private advisory form](https://github.com/OpenCoven/psyche/security/advisories/new). Keep security details out of public issues. If the form is unavailable, follow the [fallback in the security policy](https://github.com/OpenCoven/psyche/blob/main/SECURITY.md#reporting-a-vulnerability).
  - type: input
    id: version
    attributes:
      label: Public version or commit
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Use a minimal synthetic example. Summarize the result and exit code. Omit logs, environment dumps, private paths, private repository contents, prompts, user data and credentials.
    validations:
      required: true
