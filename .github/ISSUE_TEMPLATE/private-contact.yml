name: Request a private security channel
description: Request routing only. Keep all report details private.
title: Private security contact requested
body:
  - type: markdown
    attributes:
      value: Check the [repository Security page](https://github.com/OpenCoven/psyche/security) for private reporting first. When that route is unavailable, use this form to request a private channel from @BunsDev. Include no report details in the title or body.
  - type: checkboxes
    id: routing
    attributes:
      label: Routing request
      options:
        - label: I need a maintainer-confirmed private reporting channel.
          required: true
