name: Evaluate delivery readiness

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # workflow_run uses the default branch. Never check out the proposed tree.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 scripts/test-delivery-readiness.py
      - run: python3 scripts/delivery-readiness.py
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: evaluate
    if: >-
      ${{ always() && github.event.workflow_run.workflow_id == 326408880 &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.event == 'pull_request' ||
           (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Record result on the triggering CI head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RESULT: ${{ needs.evaluate.result }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f context='Delivery readiness' -f state="$state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
