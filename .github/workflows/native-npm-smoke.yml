name: Installed native npm smoke

on:
  pull_request:
    paths:
      - '.github/workflows/native-npm-smoke.yml'
      - 'scripts/smoke-installed-npm.py'
      - 'packages/psyche-npm/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  smoke:
    name: Native npm install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and exercise installed packages
        run: python scripts/smoke-installed-npm.py
