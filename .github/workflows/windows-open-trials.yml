name: Qualify Windows first-open fix
on:
  push:
    branches: [qualify/windows-open-ad22-trials]
permissions:
  contents: read
jobs:
  trials:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: aa08cd789f78bbece91b5f702b8e81a3fe9b45e8
          path: source
          persist-credentials: false
      - name: Run bounded migration trials
        working-directory: source
        run: python ../driver/scripts/windows-open-trials.py
  contributor:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aa08cd789f78bbece91b5f702b8e81a3fe9b45e8
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Exercise the contributor commands
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = aa08cd789f78bbece91b5f702b8e81a3fe9b45e8
          for mode in bootstrap fast full; do
            test -z "$(git status --porcelain --untracked-files=all)"
            case "$mode" in
              bootstrap) ./scripts/agent-bootstrap ;;
              fast|full) ./scripts/agent-check "$mode" ;;
            esac
            test -z "$(git status --porcelain --untracked-files=all)"
            echo "$mode passed; checkout clean"
          done
