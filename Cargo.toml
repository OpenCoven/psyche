[workspace]
resolver = "2"
members = [
    "crates/psyche-core",
    "crates/psyche-config",
    "crates/psyche-runtime",
    "crates/psyche-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/OpenCoven/psyche"

[workspace.dependencies]
psyche-core = { path = "crates/psyche-core" }
psyche-config = { path = "crates/psyche-config" }
psyche-runtime = { path = "crates/psyche-runtime" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde_json = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
