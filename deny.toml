[advisories]
yanked = "deny"

[licenses]
# MIT-0 is MIT without the attribution clause. First needed by borrow-or-share,
# a transitive dev-dependency of the boon JSON Schema validator (#11).
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
