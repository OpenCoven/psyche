[package]
name = "psyche-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# `publish` is NOT inherited implicitly: without this line the member falls back
# to `publish = true` and the workspace's `publish = false` is inert.
publish.workspace = true

[dependencies]
# `SecretRef` derives `Deserialize` with `#[serde(try_from = "String")]`, which
# is what forces every deserialised reference through the validating
# `TryFrom<String>` impl rather than straight into the newtype.
serde = { workspace = true }
serde_json = { workspace = true }
serde-value = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
# `digest::canonical_bytes` delegates to this for RFC 8785 canonical JSON —
# the single authority for "ignores key order" rather than a hand-rolled
# re-serialization that could drift from the spec.
serde_json_canonicalizer = { workspace = true }
# `digest::digest` hashes the canonical bytes; this crate is the workspace's
# one SHA-256 implementation so every consumer hashes the same way.
sha2 = { workspace = true }

[dev-dependencies]
# Exercises the `#[serde(try_from = "String")]` path — the way a reference
# actually enters the type in production — rather than only `TryFrom` directly.
# Property test backing "any value change changes the digest" in digest.rs.
proptest = { workspace = true }

[lints]
workspace = true
