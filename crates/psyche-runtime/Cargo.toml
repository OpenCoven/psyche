[package]
name = "psyche-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# `publish` is NOT inherited implicitly: without this line the member falls back
# to `publish = true` and the workspace's `publish = false` is inert.
publish.workspace = true

[dependencies]
psyche-config = { workspace = true }
psyche-store = { workspace = true }
thiserror = { workspace = true }
# `shutdown` observers wait asynchronously for the elected synchronous driver
# to publish its terminal outcome.
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `#[tokio::test]` needs the `macros` and `rt` features; the workspace entry
# carries both.
tokio = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
